#  8 · INFO / DATABASE
# ═════════════════════════════════════════════════════════════════════════════

# {name} — bot or spawner name queried
info-no-records:     "{prefix}<red>ɴᴏ ʀᴇᴄᴏʀᴅꜱ ꜰᴏᴜɴᴅ ꜰᴏʀ <white>{name}<red>."
info-db-unavailable: "{prefix}<red>ᴅᴀᴛᴀʙᴀꜱᴇ ᴜɴᴀᴠᴀɪʟᴀʙʟᴇ. ᴄʜᴇᴄᴋ ʏᴏᴜʀ ᴄᴏɴꜰɪɢ ᴀɴᴅ ꜱᴇʀᴠᴇʀ ʟᴏɢꜱ."


# ═════════════════════════════════════════════════════════════════════════════
#  9 · TELEPORT
# ═════════════════════════════════════════════════════════════════════════════

# {name} — bot name
tph-success:      "{prefix}<gray>ᴛᴇʟᴇᴘᴏʀᴛᴇᴅ <#0079FF>{name}</#0079FF> <gray>ᴛᴏ ʏᴏᴜ."
tph-no-bots:      "{prefix}<red>ʏᴏᴜ ʜᴀᴠᴇ ɴᴏ ᴀᴄᴛɪᴠᴇ ʙᴏᴛꜱ."
tph-specify-name: "{prefix}<red>ʏᴏᴜ ʜᴀᴠᴇ ᴍᴜʟᴛɪᴘʟᴇ ʙᴏᴛꜱ. <gray>ꜱᴘᴇᴄɪꜰʏ ᴀ ɴᴀᴍᴇ."
tph-not-found:    "{prefix}<red>ɴᴏ ʙᴏᴛ ɴᴀᴍᴇᴅ <white>{name}<red>."
tph-not-yours:    "{prefix}<red>ʏᴏᴜ ᴅᴏ ɴᴏᴛ ᴏᴡɴ ᴀ ʙᴏᴛ ɴᴀᴍᴇᴅ <white>{name}<red>."
tph-failed:       "{prefix}<red>ꜰᴀɪʟᴇᴅ ᴛᴏ ᴛᴇʟᴇᴘᴏʀᴛ <white>{name}<red>."
tph-all-result:   "{prefix}<gray>ᴛᴇʟᴇᴘᴏʀᴛᴇᴅ <#0079FF>{count}</#0079FF> <gray>ʙᴏᴛ(ꜱ) ᴛᴏ ʏᴏᴜ. <dark_gray>(<gray>ꜰᴀɪʟᴇᴅ: <white>{failed}</white><dark_gray>)"
tp-specify-name:  "{prefix}<red>ᴍᴜʟᴛɪᴘʟᴇ ʙᴏᴛꜱ ᴀʀᴇ ᴀᴄᴛɪᴠᴇ. <gray>ꜱᴘᴇᴄɪꜰʏ ᴡʜɪᴄʜ ᴏɴᴇ."
tp-no-body:       "{prefix}<red>ɴᴏ ʙᴏᴛ ʙᴏᴅʏ ᴛᴏ ᴛᴇʟᴇᴘᴏʀᴛ ᴛᴏ ᴏʀ ꜰʀᴏᴍ."
# {name} — bot display name
tp-success:       "{prefix}<gray>ᴛᴇʟᴇᴘᴏʀᴛᴇᴅ ʏᴏᴜ ᴛᴏ <#0079FF>{name}</#0079FF><gray>."
# {bots} — comma-separated list of active bot names
tp-active-bots:   "  <gray>ᴀᴄᴛɪᴠᴇ ʙᴏᴛꜱ: <#0079FF>{bots}</#0079FF>"


# ═════════════════════════════════════════════════════════════════════════════
#  10 · XP COMMAND
# ═════════════════════════════════════════════════════════════════════════════

# {name} — bot name  |  {xp} — XP points collected  |  {seconds} — cooldown duration
xp-not-found:       "{prefix}<red>ɴᴏ ʙᴏᴛ ɴᴀᴍᴇᴅ <white>{name}<red>."
xp-success:         "{prefix}<#66CC66>✓</#66CC66> <gray>ᴄᴏʟʟᴇᴄᴛᴇᴅ <#0079FF>{xp}</#0079FF> <gray>xᴘ ꜰʀᴏᴍ <#0079FF>{name}</#0079FF><gray>. <dark_gray>ᴛʜᴇʏ ᴄᴀɴɴᴏᴛ ᴘɪᴄᴋ ᴜᴘ xᴘ ꜰᴏʀ {seconds}ꜱ."
xp-no-xp:           "{prefix}<gray><#0079FF>{name}</#0079FF> <gray>ʜᴀꜱ ɴᴏ xᴘ."
xp-usage:           "{prefix}<red>ᴜꜱᴀɢᴇ<gray>: <#0079FF>/fpp xp <bot></#0079FF><gray>."
xp-cooldown-active: "{prefix}<red><white>{name}<red> ᴄᴀɴɴᴏᴛ ᴘɪᴄᴋ ᴜᴘ xᴘ ꜰᴏʀ ᴀɴᴏᴛʜᴇʀ <white>{seconds}<red>ꜱ."
xp-disabled:        "{prefix}<red>xᴘ ꜱʏꜱᴛᴇᴍ ɪꜱ ᴅɪꜱᴀʙʟᴇᴅ ɪɴ ᴄᴏɴꜰɪɢ."


# ═════════════════════════════════════════════════════════════════════════════
#  12 · NETWORK ALERT  (cross-server receive)
# ═════════════════════════════════════════════════════════════════════════════

# {message} — the alert text
alert-received: "{prefix}<red><bold>ᴀʟᴇʀᴛ<reset> <dark_gray>» <white>{message}"


# ═════════════════════════════════════════════════════════════════════════════
#  13 · SYNC  (config synchronisation)
# ═════════════════════════════════════════════════════════════════════════════

# {file}  — config file name  |  {count} — files with local changes
sync-not-available:     "{prefix}<red>ᴄᴏɴꜰɪɢ ꜱʏɴᴄ ɪꜱ ɴᴏᴛ ᴀᴠᴀɪʟᴀʙʟᴇ <dark_gray>(ɴᴇᴛᴡᴏʀᴋ ᴍᴏᴅᴇ ᴏɴʟʏ<dark_gray>)<red>."
sync-usage:             "{prefix}<red>ᴜꜱᴀɢᴇ<gray>: <#0079FF>/fpp sync <push|pull|check|status> [file]</#0079FF><gray>."
sync-push-success:      "{prefix}<#66CC66>✓</#66CC66> <gray>ᴘᴜꜱʜᴇᴅ <#0079FF>{file}</#0079FF> <gray>ᴛᴏ ᴅᴀᴛᴀʙᴀꜱᴇ."
sync-push-failed:       "{prefix}<red>ꜰᴀɪʟᴇᴅ ᴛᴏ ᴘᴜꜱʜ <white>{file}<red> ᴛᴏ ᴅᴀᴛᴀʙᴀꜱᴇ."
sync-push-all-success:  "{prefix}<#66CC66>✓</#66CC66> <gray>ᴘᴜꜱʜᴇᴅ <#0079FF>ᴀʟʟ ᴄᴏɴꜰɪɢ ꜰɪʟᴇꜱ</#0079FF> <gray>ᴛᴏ ᴅᴀᴛᴀʙᴀꜱᴇ."
sync-pull-success:      "{prefix}<#66CC66>✓</#66CC66> <gray>ᴘᴜʟʟᴇᴅ <#0079FF>{file}</#0079FF> <gray>ꜰʀᴏᴍ ᴅᴀᴛᴀʙᴀꜱᴇ."
sync-pull-failed:       "{prefix}<red>ꜰᴀɪʟᴇᴅ ᴛᴏ ᴘᴜʟʟ <white>{file}<red> ꜰʀᴏᴍ ᴅᴀᴛᴀʙᴀꜱᴇ."
sync-pull-all-success:  "{prefix}<#66CC66>✓</#66CC66> <gray>ᴘᴜʟʟᴇᴅ <#0079FF>ᴀʟʟ ᴄᴏɴꜰɪɢ ꜰɪʟᴇꜱ</#0079FF> <gray>ꜰʀᴏᴍ ᴅᴀᴛᴀʙᴀꜱᴇ."
sync-pull-no-updates:   "{prefix}<gray>ᴀʟʟ ᴄᴏɴꜰɪɢ ꜰɪʟᴇꜱ ᴀʀᴇ ᴀʟʀᴇᴀᴅʏ ᴜᴘ ᴛᴏ ᴅᴀᴛᴇ."
sync-pull-reload-hint:  "{prefix}<gray>ʀᴜɴ <#0079FF>/fpp reload</#0079FF> <gray>ᴛᴏ ᴀᴘᴘʟʏ ᴛʜᴇ ᴄʜᴀɴɢᴇꜱ."
sync-check-has-changes: "{prefix}<yellow>⚠<reset> <#0079FF>{file}</#0079FF> <gray>ʜᴀꜱ ʟᴏᴄᴀʟ ᴄʜᴀɴɢᴇꜱ <dark_gray>(ᴅɪꜰꜰᴇʀᴇɴᴛ ꜰʀᴏᴍ ᴅᴀᴛᴀʙᴀꜱᴇ<dark_gray>)."
sync-check-no-changes:  "{prefix}<#66CC66>✓</#66CC66> <#0079FF>{file}</#0079FF> <gray>ɪꜱ ᴜᴘ ᴛᴏ ᴅᴀᴛᴇ ᴡɪᴛʜ ᴅᴀᴛᴀʙᴀꜱᴇ."
