pathdebug-stuck:        "{prefix}<gold>[ᴘᴀᴛʜ] <#0079FF>{name}</#0079FF><gold> ꜱᴛᴜᴄᴋ — ʀᴇᴄᴀʟᴄᴜʟᴀᴛɪɴɢ ʀᴏᴜᴛᴇ <white>({cycle})</white><gold>."
# {name} — every stuck→recalculate cycle came back with zero real progress; giving up entirely
pathdebug-unreachable:  "{prefix}<red>[ᴘᴀᴛʜ] <#0079FF>{name}</#0079FF><red> ᴋᴇᴇᴘꜱ ɢᴇᴛᴛɪɴɢ ꜱᴛᴜᴄᴋ ᴏɴ ᴛʜᴇ ꜱᴀᴍᴇ ʀᴏᴜᴛᴇ — ᴛᴀʀɢᴇᴛ ʟᴏᴏᴋꜱ ᴜɴʀᴇᴀᴄʜᴀʙʟᴇ, ᴀʙᴀɴᴅᴏɴɪɴɢ."
# {name}
pathdebug-watchdog:      "{prefix}<red>[ᴘᴀᴛʜ] <#0079FF>{name}</#0079FF><red> ɴᴀᴠɪɢᴀᴛɪᴏɴ ᴡᴀᴛᴄʜᴅᴏɢ ꜰɪʀᴇᴅ — ᴀʙᴀɴᴅᴏɴɪɴɢ ᴛᴀʀɢᴇᴛ (ᴛᴏᴏᴋ ᴛᴏᴏ ʟᴏɴɢ)."
# {name}
pathdebug-mine-stall:    "{prefix}<gold>[ᴘᴀᴛʜ] <#0079FF>{name}</#0079FF><gold> ᴍɪɴɪɴɢ ꜱᴛᴀʟʟᴇᴅ (ɴᴏ ᴘʀᴏɢʀᴇꜱꜱ) — ᴀʙᴀɴᴅᴏɴɪɴɢ ʙʟᴏᴄᴋ. ᴄʜᴇᴄᴋ ᴛᴏᴏʟ/ʜᴀʀᴅɴᴇꜱꜱ."
