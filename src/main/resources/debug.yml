# ═══════════════════════════════════════════════════════════════════════════════
#  FakePlayerPlugin - Debug Configuration
# ═══════════════════════════════════════════════════════════════════════════════
#
# This file controls all debug logging output for the plugin.
# Each section can be enabled independently, or use the master switch above.
#
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
# MASTER DEBUG SWITCH
# ═══════════════════════════════════════════════════════════════════════════════
# Enable this to turn on ALL debug categories at once.
# Individual settings below will be overridden if this is true.
# ═══════════════════════════════════════════════════════════════════════════════
enabled: false

# ═══════════════════════════════════════════════════════════════════════════════
# DEBUG CHAT
# ═══════════════════════════════════════════════════════════════════════════════
# When true, all debug output is also sent to online OP/notify players in-game.
# ═══════════════════════════════════════════════════════════════════════════════
debug-chat: false

# ═══════════════════════════════════════════════════════════════════════════════
# GENERAL DEBUG
# ═══════════════════════════════════════════════════════════════════════════════
# Basic debug information for general plugin operations.
# ═══════════════════════════════════════════════════════════════════════════════
general: false

# ═══════════════════════════════════════════════════════════════════════════════
# STARTUP DEBUG
# ═══════════════════════════════════════════════════════════════════════════════
# Detailed logging during plugin initialization and startup.
# Includes: reflection caching, NMS method resolution, service initialization
# ═══════════════════════════════════════════════════════════════════════════════
startup: false

# ═══════════════════════════════════════════════════════════════════════════════
# NMS (Net Minecraft Server) DEBUG
# ═══════════════════════════════════════════════════════════════════════════════
# Low-level Minecraft server interaction debugging.
# ═══════════════════════════════════════════════════════════════════════════════
nms:
  # Master switch for all NMS debugging
  enabled: false
  
  # Bot lifecycle events (spawn, despawn, death, removal)
  bot: false
  
  # NMS connection/packet listener events
  connection: false

  # Bot damage event decisions, cancellation state, and final damage values
  damage: false
   
  # Physics and movement tick operations
  physics: false
  
  # Skin application and resolution
  skin: false

# ═══════════════════════════════════════════════════════════════════════════════
# DATABASE DEBUG
# ═══════════════════════════════════════════════════════════════════════════════
# Database operations for SQLite and MySQL.
# ═══════════════════════════════════════════════════════════════════════════════
database:
  # Master switch for all database debugging
  enabled: false
  
  # Connection lifecycle (connect, disconnect, validation, health checks)
  connection: false
  
  # Query operations (INSERT, UPDATE, DELETE, SELECT)
  operations: false
  
  # Migration and schema operations
  migration: false
  
  # Persistence save/load operations
  persistence: false

# ═══════════════════════════════════════════════════════════════════════════════
# NETWORK DEBUG
# ═══════════════════════════════════════════════════════════════════════════════
# Multi-server network operations (Velocity/BungeeCord).
# ═══════════════════════════════════════════════════════════════════════════════
network: false

# ═══════════════════════════════════════════════════════════════════════════════
# PACKET DEBUG
# ═══════════════════════════════════════════════════════════════════════════════
# Packet injection and manipulation debugging.
# ═══════════════════════════════════════════════════════════════════════════════
packets: false

# ═══════════════════════════════════════════════════════════════════════════════
# CONFIG SYNC DEBUG
# ═══════════════════════════════════════════════════════════════════════════════
# Configuration synchronization across network servers.
# ═══════════════════════════════════════════════════════════════════════════════
config-sync: false

# ═══════════════════════════════════════════════════════════════════════════════
# CHAT DEBUG
# ═══════════════════════════════════════════════════════════════════════════════
# Bot chat system debugging.
# ═══════════════════════════════════════════════════════════════════════════════
chat: false

# ═══════════════════════════════════════════════════════════════════════════════
# PATHFINDING DEBUG
# ═══════════════════════════════════════════════════════════════════════════════
# Detailed navigation diagnostics logged to console: stuck/recalculate cycles, give-ups,
# no-path failures, /fpp find's navigation watchdog, and mining stalls — position, target,
# waypoint progress, path options, and the reason each failure happened. Also mirrored to
# in-game chat for whoever has the pathfinding path-debug view enabled for that bot.
# ═══════════════════════════════════════════════════════════════════════════════
pathfinding: false

# ═══════════════════════════════════════════════════════════════════════════════
# SKIN POOL DEBUG
# ═══════════════════════════════════════════════════════════════════════════════
# Full trace of the rarity skin pipeline: pool loading, the roll each spawn makes,
# cache hits/misses, PNG download attempts (with HTTP codes), slim/classic model
# detection, MineSkin signing requests/responses, and skin application. Turn this
# on to diagnose bots spawning without their pool skin.
# ═══════════════════════════════════════════════════════════════════════════════
skin-pool: false

# ═══════════════════════════════════════════════════════════════════════════════
# COMMAND DEBUG
# ═══════════════════════════════════════════════════════════════════════════════
# Command execution and argument parsing debugging.
# ═══════════════════════════════════════════════════════════════════════════════
commands: false

# ═══════════════════════════════════════════════════════════════════════════════
# HEAD AI DEBUG
# ═══════════════════════════════════════════════════════════════════════════════
# Bot head rotation and AI targeting debugging.
# ═══════════════════════════════════════════════════════════════════════════════
head-ai: false

# ═══════════════════════════════════════════════════════════════════════════════
# INTERACTION DEBUG
# ═══════════════════════════════════════════════════════════════════════════════
# Bot click-system debugging. Each traces the full pipeline: target resolution,
# navigation to reach, the exact serverbound packets dispatched (dig start/stop/
# abort, attack, use-item-on, use-item, entity interact), and stop/cleanup.
#   *-head   also traces head-aim / target-selection decisions.
# ═══════════════════════════════════════════════════════════════════════════════
right-click: false
right-click-head: false
left-click: false
left-click-head: false
